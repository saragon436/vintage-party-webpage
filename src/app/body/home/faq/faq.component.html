<section class="section" id="faq">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow on-light">Preguntas frecuentes</span>
      <h2 class="reveal-title" appScrollReveal>Antes de escribirnos, quizás esto ya responde tu duda</h2>
    </div>
    <div class="faq-list">
      <div class="faq-item reveal" [appScrollReveal]="i" *ngFor="let f of faqs; let i = index">
        <button class="faq-question" (click)="toggle(i)">
          <span>{{ f.q }}</span>
          <svg [class]="openIndex === i ? 'faq-chevron open' : 'faq-chevron'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div [class]="openIndex === i ? 'faq-answer open' : 'faq-answer'">
          <div class="faq-answer-inner">
            <p class="faq-answer-text">{{ f.a }}</p>
          </div>
        </div>
      </div>
    </div>
    <p class="faq-note">¿No encontraste tu respuesta? <a href="https://wa.me/51936942342" target="_blank" style="color:var(--purple-700);font-weight:700;">Escríbenos por WhatsApp</a>.</p>
  </div>
</section>
