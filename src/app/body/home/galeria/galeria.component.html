<section class="section" style="padding-top:10px;">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow on-light">Galería</span>
      <h2 class="reveal-title" appScrollReveal>Eventos decorados por Vintage Party</h2>
    </div>
    <div class="gal-grid">
      <img [src]="g.img" [alt]="g.alt" *ngFor="let g of images" (click)="open(g.img, g.alt)" style="cursor:zoom-in;">
    </div>
    <div style="text-align:center;margin-top:26px;">
      <a href="https://instagram.com/vintagepartyperu" target="_blank" class="btn btn-ghost btn-sm">Síguenos &#64;vintagepartyperu</a>
    </div>
  </div>
</section>
