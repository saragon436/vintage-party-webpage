<div class="promo-banner" *ngIf="visible">
  <div class="promo-banner-inner">
    <span class="promo-icon-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19 9a4 4 0 0 1 0 6"/></svg>
    </span>
    <span>Oferta de temporada: 15% dcto. en cilindros y paneles para reservas de este mes.</span>
    <a href="#catalogo" class="promo-cta">Ver catálogo</a>
  </div>
  <button class="promo-close" (click)="close()" aria-label="Cerrar aviso">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>
