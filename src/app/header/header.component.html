<header class="site">
  <div class="nav-row">
    <a href="#top" class="brand">
      <img src="images/logo-v.jpeg" alt="Vintage Party">
      <span>
        <span class="brand-word">Vintage Party</span>
        <span class="brand-sub">Mobiliario para eventos</span>
      </span>
    </a>

    <nav class="links">
      <a href="#categorias">Categorías</a>
      <a href="#catalogo">Catálogo</a>
      <a href="#como-funciona">Cómo funciona</a>
      <a href="#empresas">Empresas</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <div class="head-actions">
      <button class="claims-pill" (click)="openClaims($event)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h13l3 3v13H4z"/><path d="M9 9h9M9 13h9M9 17h5"/></svg>
        <span>Libro de Reclamaciones</span>
      </button>
      <a class="icon-btn" href="https://instagram.com/vintagepartyperu" target="_blank" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </a>
      <button class="icon-btn" (click)="toggleCart()" aria-label="Ver cotización">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
        <span class="badge" *ngIf="(cart.count$ | async) as count">{{ count }}</span>
      </button>
    </div>
  </div>
</header>
